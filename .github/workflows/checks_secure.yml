name: Checks (secure)
# These are run on base branch with read/write access.

on:
  # This trigger is only safe-ish to use if steps are gated behind the
  # "Check user permission" step below.
  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [synchronize]

permissions: write-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  dismiss_stale_approvals:
    # Dismiss stale approvals for users without write access, or if this PR comes from a fork.
    runs-on: ubuntu-22.04
    # Only if another commit was added to the PR.
    steps:
      - name: Check user permission
        id: check
        # This step sets outputs.has-permission to '1' or ''
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          permission=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ACTOR}/permission" --jq '.permission' || echo "none")
          echo "User ${ACTOR} has permission: ${permission}"
          if [[ "${permission}" == "write" || "${permission}" == "admin" ]]; then
            echo "has-permission=1" >> "$GITHUB_OUTPUT"
          else
            echo "has-permission=" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        if: steps.check.outputs.has-permission != 1 || github.event.pull_request.head.repo.full_name != github.repository
        with:
          persist-credentials: true # zizmor: ignore[artipacked]
          submodules: false
      - name: Setup python
        if: steps.check.outputs.has-permission != 1 || github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: 3.9
      - name: Install prerequisites
        if: steps.check.outputs.has-permission != 1 || github.event.pull_request.head.repo.full_name != github.repository
        run: pip install -r scripts/gha/python_requirements.txt
      - name: Dismiss reviews
        if: steps.check.outputs.has-permission != 1 || github.event.pull_request.head.repo.full_name != github.repository
        shell: bash
        run: |
          python scripts/gha/dismiss_reviews.py --token ${{github.token}} --pull_number ${{github.event.pull_request.number}} --review_state=APPROVED --message "🍞 Dismissed stale approval on external PR."
