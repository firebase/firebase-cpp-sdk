name: Desktop Builds

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      expanded_matrix:
        description: 'Use an expanded matrix?'
        default: '0'
        required: true

env:
  CCACHE_DIR: ${{ github.workspace }}/ccache_dir
  GITHUB_TOKEN: ${{ github.token }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  prepare_matrix:
    runs-on: ubuntu-22.04
    outputs:
      matrix_os: ${{ steps.export-result.outputs.matrix_os }}
      matrix_build_type: ${{ steps.export-result.outputs.matrix_build_type }}
      matrix_architecture: ${{ steps.export-result.outputs.matrix_architecture }}
      matrix_msvc_runtime: ${{ steps.export-result.outputs.msvc_runtime }}
      matrix_xcode_version: ${{ steps.export-result.outputs.xcode_version }}
      matrix_python_version: ${{ steps.export-result.outputs.python_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: true # zizmor: ignore[artipacked]
          submodules: false
      - name: Use expanded matrix
        if: github.event.inputs.expanded_matrix == '1'
        run: |
          echo "EXPANDED_MATRIX_PARAM=-e=1" >> $GITHUB_ENV
      - id: export-result
        run: |
          echo "matrix_os=$( python scripts/gha/print_matrix_configuration.py -w desktop -k os ${EXPANDED_MATRIX_PARAM})" >> $GITHUB_OUTPUT
          echo "matrix_build_type=$( python scripts/gha/print_matrix_configuration.py -w desktop -k build_type ${EXPANDED_MATRIX_PARAM})" >> $GITHUB_OUTPUT
          echo "matrix_architecture=$( python scripts/gha/print_matrix_configuration.py -w desktop -k architecture ${EXPANDED_MATRIX_PARAM})" >> $GITHUB_OUTPUT
          echo "msvc_runtime=$( python scripts/gha/print_matrix_configuration.py -w desktop -k msvc_runtime ${EXPANDED_MATRIX_PARAM})" >> $GITHUB_OUTPUT
          echo "xcode_version=$( python scripts/gha/print_matrix_configuration.py -w desktop -k xcode_version ${EXPANDED_MATRIX_PARAM})" >> $GITHUB_OUTPUT
          echo "python_version=$( python scripts/gha/print_matrix_configuration.py -w desktop -k python_version ${EXPANDED_MATRIX_PARAM})" >> $GITHUB_OUTPUT

  build:
    name: ${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.architecture }}-${{ matrix.msvc_runtime}}
    runs-on: ${{ matrix.os }}
    needs: prepare_matrix
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.prepare_matrix.outputs.matrix_os) }}
        build_type: ${{ fromJson(needs.prepare_matrix.outputs.matrix_build_type) }}
        architecture: ${{ fromJson(needs.prepare_matrix.outputs.matrix_architecture) }}
        msvc_runtime: ${{ fromJson(needs.prepare_matrix.outputs.matrix_msvc_runtime) }}
        xcode_version: ${{ fromJson(needs.prepare_matrix.outputs.matrix_xcode_version) }}
        python_version: ${{ fromJson(needs.prepare_matrix.outputs.matrix_python_version) }}
        include:
          # More Windows combinations are in the expanded matrix. 
          - os: windows-2022
            build_type: "Release"
            architecture: "x64"
            msvc_runtime: "static"
          - os: windows-2022
            build_type: "Debug"
            architecture: "x86"
            msvc_runtime: "dynamic"
        exclude:
          # msvc_runtime excludes
          - os: ubuntu-22.04
            msvc_runtime: "dynamic"
          - os: macos-26
            msvc_runtime: "dynamic"
          # architecture excluees
          - os: macos-26
            architecture: "x86"
          - os: macos-26
            architecture: "x64"
          # Xcode excludes -- allow only one on osx and linux
          - os: ubuntu-22.04
            xcode_version: "11.7"
          - os: windows-2022
            xcode_version: "11.7"
          - os: ubuntu-22.04
            xcode_version: "12.5.1"
          - os: windows-2022
            xcode_version: "12.5.1"
          # arm64 is only for macos
          - os: ubuntu-22.04
            architecture: "arm64"
          - os: windows-2022
            architecture: "arm64"
          # arm64 can't be built on Xcode 11
          - xcode_version: "11.7"
            architecture: "arm64"
    steps:                
      - uses: lukka/get-cmake@591817e96fcad43505fb4eae36172462abb3a42e # ratchet:lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"
      - name: Store git credentials for all git commands
        # Forces all git commands to use authenticated https, to prevent throttling.
        shell: bash
        run: |
          git config --global credential.helper 'store --file /tmp/git-credentials'
          echo 'https://${{ github.token }}@github.com' > /tmp/git-credentials

      - name: Enable Git Long-paths Support
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Setup Xcode version (macos)
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer
        env:
          XCODE_VERSION: ${{ matrix.xcode_version }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: true # zizmor: ignore[artipacked]
          submodules: true
      
      - name: Set env vars (ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run:  echo "VCPKG_SUFFIX=linux" >> $GITHUB_ENV

      - name: Set env vars (macos)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: echo "VCPKG_SUFFIX=osx" >> $GITHUB_ENV

      - name: Set env vars (windows)
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          if [[ ${MATRIX_MSVC_RUNTIME}  == "static" ]];
            then echo "VCPKG_SUFFIX=windows-static" >> $GITHUB_ENV;
          elif [[ ${MATRIX_MSVC_RUNTIME} == "dynamic" ]];
            then echo "VCPKG_SUFFIX=windows-static-md" >> $GITHUB_ENV;
          else
            echo "Warning, could not resolve vcpkg suffix.";
          fi
        env:
          MATRIX_MSVC_RUNTIME: ${{matrix.msvc_runtime}}

      - name: Set env variables for subsequent steps (all)
        shell: bash
        run: |
          echo "BUILD_TYPE: ${MATRIX_BUILD_TYPE}"
          echo "VCPKG_SUFFIX: ${VCPKG_SUFFIX}"
          echo "VCPKG_RESPONSE_FILE=external/vcpkg_custom_data/response_files/${MATRIX_ARCHITECTURE}-${VCPKG_SUFFIX}.txt" >> $GITHUB_ENV
          echo "MATRIX_UNIQUE_NAME=${MATRIX_OS}-${MATRIX_BUILD_TYPE}-${MATRIX_ARCHITECTURE}-${MATRIX_MSVC_RUNTIME}" >> $GITHUB_ENV
          if [[ '${{ matrix.sdk_platform }}' == 'darwin' ]]; then
            # If Mac, also hash vcpkg cache on Xcode version.
            echo "VCPKG_EXTRA_HASH=-xcode${MATRIX_XCODE_VERSION}" >> $GITHUB_ENV
          fi
        env:
          MATRIX_BUILD_TYPE: ${{ matrix.build_type }}
          MATRIX_ARCHITECTURE: ${{ matrix.architecture }}
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_MSVC_RUNTIME: ${{ matrix.msvc_runtime }}
          MATRIX_XCODE_VERSION: ${{matrix.xcode_version}}

      - name: Cache vcpkg C++ dependencies
        id: cache_vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
        with:
          path: external/vcpkg/installed
          key: dev-vcpkg-${{ matrix.architecture }}-${{ env.VCPKG_SUFFIX }}-${{ matrix.msvc_runtime }}-${{ hashFiles(format('{0}', env.VCPKG_RESPONSE_FILE)) }}-${{ hashFiles('.git/modules/external/vcpkg/HEAD') }}${{ env.VCPKG_EXTRA_HASH }}

      - name: Cache ccache files
        if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
        id: cache_ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
        with:
          path: ccache_dir
          key: dev-test-ccache-${{ env.MATRIX_UNIQUE_NAME }}${{ env.VCPKG_EXTRA_HASH }}

      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        if: startsWith(matrix.os, 'ubuntu')
        with:
          python-version: ${{ matrix.python_version }}
          architecture: x64

      - name: Setup python (Mac)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        if: startsWith(matrix.os, 'macos')
        with:
          python-version: ${{ matrix.python_version }}
          architecture: ${{ matrix.architecture }}


      - name: Install Desktop SDK prerequisites
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # ratchet:nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          command: |
            python scripts/gha/install_prereqs_desktop.py --gha_build --arch '${{ matrix.architecture }}'

      - name: Build SDK
        shell: bash
        run: |
          python scripts/gha/build_desktop.py --build_tests --arch "${MATRIX_ARCHITECTURE}" --config "${MATRIX_BUILD_TYPE}" --msvc_runtime_library "${MATRIX_MSVC_RUNTIME}" --gha_build
        env:
          MATRIX_ARCHITECTURE: ${{ matrix.architecture }}
          MATRIX_BUILD_TYPE: ${{ matrix.build_type }}
          MATRIX_MSVC_RUNTIME: ${{ matrix.msvc_runtime }}

      - name: Stats for ccache (mac and linux)
        if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
        run: ccache -s

      - name: Print built libraries
        shell: bash
        run: |
          find build -name "*.lib"
          find build -name "*.dll"
          find build -name "*.dylib"
          find build -name "*.a"
          find build -name "*.so"

      - name: Inspect firebase libraries for cpu arch and msvc runtime.
        shell: bash
        run: |
          python scripts/gha/inspect_built_libraries.py build/
        continue-on-error: true

      - name: Prep crash support (linux)
        # Ensures directory structure is in place to capture core files on Linux.
        if: startsWith(matrix.build_type, 'Debug') && startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          echo '/tmp/cores/core.%E' | sudo tee /proc/sys/kernel/core_pattern
          sudo mkdir -p /tmp/cores/
          sudo rm -rf /tmp/cores/*

      - name: Prep crash support (mac)
        # Ensures no lingering crashes from the previous run.
        if: startsWith(matrix.build_type, 'Debug') && startsWith(matrix.os, 'macos')
        run: |
          rm -rf ~/Library/Logs/DiagnosticReports/*

      - name: Run unit tests (windows & macos)
        # TODO: Enable tests for x86 once they are all working
        if: (startsWith(matrix.os, 'windows') || startsWith(matrix.os, 'macos')) && matrix.architecture != 'x86' && matrix.architecture != 'arm64'
        env:
          LANG: en_US
        run: |
          cd build
          ctest --repeat until-pass:3 --output-on-failure -LE multi_app_stress -E firestore_util_test

      - name: Run unit tests (linux)
        # Linux exists as its own standalone execution step in order to invoke
        # platform-specific `ulimit` to enable crash collection.  The ulimit
        # command must be invoked in same shell instance of that runs the
        # tests.
        if: startsWith(matrix.os, 'ubuntu')
        env:
          LANG: en_US
        run: |
          ulimit -c unlimited
          cd build
          sudo ctest --repeat until-pass:3 --output-on-failure -LE multi_app_stress

      - name: Prep bins for achive (linux)
        # Copies all of the binary files into one directory for ease in
        # archiving. Directory contents are then marked readable for the
        # archive step.
        if: failure() && startsWith(matrix.build_type, 'Debug') && ( startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos') )
        shell: bash
        run: |
          sudo rm -rf /tmp/bins/* || :
          sudo mkdir -p /tmp/bins/
          sudo rm -rf ./build/app/tests/firebase_test
          sudo cp -f ./build/*/tests/firebase* /tmp/bins
          sudo chmod -R +rwx /tmp/bins/* || :

      - name: Prep crash data for archive (linux)
        # Marks the contents of the core dump directory to be readable for the
        # archiving step on linux.
        shell: bash
        if: failure() && startsWith(matrix.build_type, 'Debug') && startsWith(matrix.os, 'ubuntu')
        run: |
          sudo chmod -R +rwx /tmp/cores/* || :

      - name: Prep crash data for archive (macos)
        # Freshly made diagnostic reports are marked as readable for
        # the archive step. Note: for some reason /tmp/cores doesn't survive
        # long enough for archiving on mac, so prep the DiagnosticReports
        # directory instead.
        shell: bash
        if: failure() && startsWith(matrix.build_type, 'Debug') && startsWith(matrix.os, 'macos')
        run: |
          sudo chmod -R +rwx ~/Library/Logs/DiagnosticReports/* || :

      - name: Archive crashes and binaries (linux)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7
        if: failure() && startsWith(matrix.build_type, 'Debug') && startsWith(matrix.os, 'ubuntu')
        with:
          name: crashes-${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.architecture }}-${{ matrix.python_version }}
          path: |
            /tmp/cores/*
            /tmp/bins/*

      - name: Archive crashes (mac)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7
        if: failure() && startsWith(matrix.build_type, 'Debug') && startsWith(matrix.os, 'macos')
        with:
          name: crashes-${{ matrix.os }}-${{ matrix.build_type }}-${{ matrix.architecture }}-${{ matrix.python_version }}-${{ matrix.xcode_version }}
          path: |
            ~/Library/Logs/DiagnosticReports/*
            /tmp/bins/*

  local_integration_tests: 
    ### This job run firestore integration test on Linux Dekstop as required by firestore team. 
    ### It's possible to add more apps here once integration tests are less flaky.
    name: local-integration-tests-linux-openssl
    needs: prepare_matrix
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
    steps:
      - uses: lukka/get-cmake@591817e96fcad43505fb4eae36172462abb3a42e # ratchet:lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: true # zizmor: ignore[artipacked]
          ref: ${{needs.check_and_prepare.outputs.github_ref}}
          submodules: true
      - name: Cache vcpkg C++ dependencies
        id: cache_vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
        with:
          path: external/vcpkg/installed
          key: dev-vcpkg-${{ env.VCPKG_TRIPLET }}-${{ hashFiles(format('{0}', env.VCPKG_RESPONSE_FILE)) }}-${{ hashFiles('.git/modules/external/vcpkg/HEAD') }}
      - name: Cache ccache files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
        with:
          path: ccache_dir
          key: local-integration-tests-linux-openssl-ccache
      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: ${{ fromJson(needs.prepare_matrix.outputs.matrix_python_version)[0] }}
      - name: Prepare for integration tests
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # ratchet:nick-fields/retry@v4
        with:
          shell: bash
          timeout_minutes: 15
          max_attempts: 3
          command: scripts/gha/install_test_workflow_prereqs.sh -p Desktop -a 'x64' -s 'openssl'
      - name: Build integration tests
        shell: bash
        env: 
          CCACHE_DIR: ${{ github.workspace }}/ccache_dir
        run: |
          apis=$( python scripts/gha/print_matrix_configuration.py -c -w integration_tests -k apis -m=1 )
          python scripts/gha/build_testapps.py --p Desktop \
            --t ${apis} \
            --output_directory "${{ github.workspace }}" \
            --artifact_name "desktop-ubuntu-22.04-openssl" \
            --noadd_timestamp \
            --short_output_paths \
            --cmake_flag=-DFIREBASE_QUICK_TEST=ON
      - name: Summarize build results
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cat build-results-desktop-ubuntu-22.04-openssl.log
          if [[ "${JOB_STATUS}" != "success" ]]; then
            exit 1
          fi
        env:
          JOB_STATUS: ${{ job.status }}
      - name: Set up Node (18)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7
        with:
          node-version: 18.x
      - name: Setup Firestore Emulator
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # ratchet:nick-fields/retry@v4
        with:
          shell: bash
          timeout_minutes: 5
          max_attempts: 3
          command: npm install -g firebase-tools     
      - name: Setup java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # ratchet:actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Run Desktop integration tests
        run: |
          cp scripts/gha/integration_testing/google-services.json testapps-desktop-ubuntu-22.04-openssl/firestore/google-services.json
          firebase emulators:exec --only firestore --project demo-example 'python scripts/gha/desktop_tester.py --testapp_dir testapps-desktop-ubuntu-22.04-openssl --logfile_name "desktop-ubuntu-22.04-openssl"'
        env:
          USE_FIRESTORE_EMULATOR: true
      - name: Summarize test results
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cat testapps-desktop-ubuntu-22.04-openssl/test-results-desktop-ubuntu-22.04-openssl.log
          if [[ "${JOB_STATUS}" != "success" ]]; then
            exit 1
          fi
        env:
          JOB_STATUS: ${{ job.status }}

  linux_clang_thread_safety:
    name: linux-clang-thread-safety
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: lukka/get-cmake@591817e96fcad43505fb4eae36172462abb3a42e # ratchet:lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: true # zizmor: ignore[artipacked]
          submodules: false
      - name: Cache ccache files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
        with:
          path: ccache_dir
          key: linux-clang-tsa-ccache-${{ hashFiles('CMakeLists.txt', 'cmake/external/*.cmake') }}
          restore-keys: |
            linux-clang-tsa-ccache-
      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install Clang and build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm ccache ninja-build libssl-dev libsecret-1-dev libglib2.0-dev zlib1g-dev protobuf-compiler pkg-config python3-venv
          python3 -m pip install -r external/pip_requirements.txt
          clang++ --version
      - name: Configure with Clang -Wthread-safety
        run: |
          CC=clang CXX=clang++ cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DFIREBASE_CPP_BUILD_TESTS=ON \
            -DFIREBASE_FORCE_FAKE_SECURE_STORAGE=ON \
            -DFIREBASE_USE_BORINGSSL=OFF \
            -DFIREBASE_LINUX_USE_CXX11_ABI=ON \
            -DFIREBASE_CPP_ENABLE_THREAD_SAFETY_ANALYSIS=ON \
            -DFIREBASE_GITHUB_ACTION_BUILD=ON \
            -DCMAKE_C_FLAGS="-Wno-unknown-warning-option" \
            -DCMAKE_CXX_FLAGS="-Wno-unknown-warning-option"
      - name: Build SDK libraries and collect -Wthread-safety diagnostics
        run: |
          set -o pipefail
          cmake --build build -j "$(nproc)" --target \
            firebase_app firebase_rest_lib firebase_analytics firebase_app_check \
            firebase_auth firebase_database firebase_firestore firebase_functions \
            firebase_installations firebase_messaging firebase_remote_config \
            firebase_storage firebase_ump \
            firebase_multi_app_lifecycle_unit_test \
            firebase_multi_app_emulator_stress_test \
            2>&1 | tee tsa_build.log
          echo "=== UNIQUE -Wthread-safety DIAGNOSTICS ==="
          grep -E "\[-Wthread-safety" tsa_build.log | sed "s|${GITHUB_WORKSPACE}/||g" | sort -u | tee tsa_unique_warnings.txt || true
          COUNT=$(wc -l < tsa_unique_warnings.txt)
          echo "Total unique -Wthread-safety warnings: ${COUNT}"
          if [[ "${COUNT}" -gt 0 ]]; then
            echo "::warning::Found ${COUNT} unique -Wthread-safety diagnostics (see tsa_unique_warnings.txt)"
          fi
      - name: Upload thread-safety logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7
        with:
          name: linux-clang-thread-safety-logs
          path: |
            tsa_build.log
            tsa_unique_warnings.txt

  linux_asan_ubsan:
    name: linux-asan-ubsan
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: lukka/get-cmake@591817e96fcad43505fb4eae36172462abb3a42e # ratchet:lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: true # zizmor: ignore[artipacked]
          submodules: false
      - name: Cache ccache files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
        with:
          path: ccache_dir
          key: linux-asan-ubsan-ccache-${{ hashFiles('CMakeLists.txt', 'cmake/external/*.cmake') }}
          restore-keys: |
            linux-asan-ubsan-ccache-
      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install Clang, sanitizers, and build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm gdb ccache ninja-build libssl-dev libsecret-1-dev libglib2.0-dev zlib1g-dev protobuf-compiler pkg-config python3-venv
          python3 -m pip install -r external/pip_requirements.txt
      - name: Configure with ASan + UBSan
        run: |
          SAN_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g -Wno-unknown-warning-option"
          CC=clang CXX=clang++ cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DFIREBASE_CPP_BUILD_TESTS=ON \
            -DFIREBASE_FORCE_FAKE_SECURE_STORAGE=ON \
            -DFIREBASE_USE_BORINGSSL=OFF \
            -DFIREBASE_LINUX_USE_CXX11_ABI=ON \
            -DFIREBASE_GITHUB_ACTION_BUILD=ON \
            -DCMAKE_C_FLAGS="${SAN_FLAGS}" \
            -DCMAKE_CXX_FLAGS="${SAN_FLAGS}" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build unit and stress tests (ASan + UBSan)
        run: cmake --build build -j "$(nproc)"
      - name: Run unit suite and offline multi-App stress tests (ASan + UBSan)
        id: asan_unit
        continue-on-error: true
        env:
          ASAN_OPTIONS: "detect_leaks=0:symbolize=1:print_stacktrace=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=0"
        run: |
          export ASAN_SYMBOLIZER_PATH="$(which llvm-symbolizer)"
          set -o pipefail
          python3 scripts/gha/run_sanitizer_suite.py \
            --build_dir build --mode asan --run_unit_ctest --run_unit_stress \
            --case_timeout 90 2>&1 | tee asan_unit_and_stress.log
      - name: Set up Node (18)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7
        with:
          node-version: 18.x
      - name: Install firebase-tools
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # ratchet:nick-fields/retry@v4
        with:
          shell: bash
          timeout_minutes: 5
          max_attempts: 3
          command: npm install -g firebase-tools
      - name: Setup java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # ratchet:actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Run emulator multi-App stress tests (ASan + UBSan)
        id: asan_emulator
        continue-on-error: true
        env:
          ASAN_OPTIONS: "detect_leaks=0:symbolize=1:print_stacktrace=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=0"
        run: |
          export ASAN_SYMBOLIZER_PATH="$(which llvm-symbolizer)"
          set -o pipefail
          firebase emulators:exec \
            --config testing/stress/firebase.json \
            --only auth,firestore,database,storage \
            --project demo-example \
            'python3 scripts/gha/run_sanitizer_suite.py --build_dir build --mode asan --run_emulator_stress --case_timeout 90' \
            2>&1 | tee asan_emulator_stress.log
      - name: Upload ASan/UBSan logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7
        with:
          name: linux-asan-ubsan-logs
          path: |
            asan_unit_and_stress.log
            asan_emulator_stress.log
      - name: Final ASan/UBSan status
        run: |
          echo "unit+offline_stress: ${{ steps.asan_unit.outcome }}"
          echo "emulator_stress: ${{ steps.asan_emulator.outcome }}"
          if [[ "${{ steps.asan_unit.outcome }}" != "success" || "${{ steps.asan_emulator.outcome }}" != "success" ]]; then
            exit 1
          fi

  linux_tsan:
    name: linux-tsan
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: lukka/get-cmake@591817e96fcad43505fb4eae36172462abb3a42e # ratchet:lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: true # zizmor: ignore[artipacked]
          submodules: false
      - name: Cache ccache files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
        with:
          path: ccache_dir
          key: linux-tsan-ccache-${{ hashFiles('CMakeLists.txt', 'cmake/external/*.cmake') }}
          restore-keys: |
            linux-tsan-ccache-
      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install Clang, TSan, and build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm gdb ccache ninja-build libssl-dev libsecret-1-dev libglib2.0-dev zlib1g-dev protobuf-compiler pkg-config python3-venv
          python3 -m pip install -r external/pip_requirements.txt
          sudo sysctl -w vm.mmap_rnd_bits=28 || true
      - name: Configure with TSan
        run: |
          TSAN_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g -Wno-unknown-warning-option"
          CC=clang CXX=clang++ cmake -G Ninja -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DFIREBASE_CPP_BUILD_TESTS=ON \
            -DFIREBASE_FORCE_FAKE_SECURE_STORAGE=ON \
            -DFIREBASE_USE_BORINGSSL=OFF \
            -DFIREBASE_LINUX_USE_CXX11_ABI=ON \
            -DFIREBASE_GITHUB_ACTION_BUILD=ON \
            -DCMAKE_C_FLAGS="${TSAN_FLAGS}" \
            -DCMAKE_CXX_FLAGS="${TSAN_FLAGS}" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"
      - name: Build unit and stress tests (TSan)
        run: cmake --build build -j "$(nproc)"
      - name: Run unit suite and offline multi-App stress tests (TSan)
        id: tsan_unit
        continue-on-error: true
        env:
          TSAN_OPTIONS: "halt_on_error=0:second_deadlock_stack=1:history_size=7:symbolize=1"
        run: |
          export TSAN_SYMBOLIZER_PATH="$(which llvm-symbolizer)"
          set -o pipefail
          python3 scripts/gha/run_sanitizer_suite.py \
            --build_dir build --mode tsan --run_unit_ctest --run_unit_stress \
            --case_timeout 120 2>&1 | tee tsan_unit_and_stress.log
      - name: Set up Node (18)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # ratchet:actions/setup-node@v7
        with:
          node-version: 18.x
      - name: Install firebase-tools
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # ratchet:nick-fields/retry@v4
        with:
          shell: bash
          timeout_minutes: 5
          max_attempts: 3
          command: npm install -g firebase-tools
      - name: Setup java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # ratchet:actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Run emulator multi-App stress tests (TSan)
        id: tsan_emulator
        continue-on-error: true
        env:
          TSAN_OPTIONS: "halt_on_error=0:second_deadlock_stack=1:history_size=7:symbolize=1"
        run: |
          export TSAN_SYMBOLIZER_PATH="$(which llvm-symbolizer)"
          set -o pipefail
          firebase emulators:exec \
            --config testing/stress/firebase.json \
            --only auth,firestore,database,storage \
            --project demo-example \
            'python3 scripts/gha/run_sanitizer_suite.py --build_dir build --mode tsan --run_emulator_stress --case_timeout 120' \
            2>&1 | tee tsan_emulator_stress.log
      - name: Upload TSan logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7
        with:
          name: linux-tsan-logs
          path: |
            tsan_unit_and_stress.log
            tsan_emulator_stress.log
      - name: Final TSan status
        run: |
          echo "unit+offline_stress: ${{ steps.tsan_unit.outcome }}"
          echo "emulator_stress: ${{ steps.tsan_emulator.outcome }}"
          if [[ "${{ steps.tsan_unit.outcome }}" != "success" || "${{ steps.tsan_emulator.outcome }}" != "success" ]]; then
            exit 1
          fi
