name: Lint

on:
  pull_request:
    types: [opened,synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint_warnings_check_and_comment:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: true # zizmor: ignore[artipacked]
          repository: cpplint/cpplint
          ref: "1.5.5"
          path: cpplint
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          persist-credentials: true # zizmor: ignore[artipacked]
          submodules: false
          path: firebase

      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: 3.9
      - name: Install prerequisites
        run: |
          cd firebase
          python scripts/gha/install_prereqs_desktop.py
      - name: Install prerequisites
        run: |
          python3 -m pip install unidiff
      - name: Run cpplint
        shell: bash
        run: |
          set -e
          cd firebase
          python3 scripts/gha/lint_commenter.py -l ../cpplint/cpplint.py -p ${{ github.event.pull_request.number }} -t ${{ github.token }} -A
