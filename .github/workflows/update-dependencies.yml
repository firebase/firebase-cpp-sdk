name: Update Android and iOS dependencies
on:
  workflow_dispatch:
    inputs:
      updateAndroid:
        description: 'update Android dependencies?'
        default: 1
      updateiOS:
        description: 'update iOS dependencies?'
        default: 1
      triggerTests:
        description: 'trigger tests on PR?'
        default: 1
      baseBranch:
        description: 'create the new branch from this base'
        default: 'main'
      comment:
        description: 'optional comment to add to PR'
        default: ''

permissions: write-all

env:
  branchPrefix: "workflow/auto-update-deps-"
  triggerTestsLabel: "tests-requested: quick"

jobs:
  update_dependencies:
    name: update-deps
    runs-on: macos-15
    steps:
      - name: Get token for firebase-workflow-trigger
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # ratchet:actions/create-github-app-token@v1
        id: generate-token
        with:
          client-id: ${{ secrets.WORKFLOW_TRIGGER_CLIENT_ID }}
          private-key: ${{ secrets.WORKFLOW_TRIGGER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Setup python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # ratchet:actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Check out base branch
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # ratchet:actions/checkout@v3
        with:
          persist-credentials: true # zizmor: ignore[artipacked]
          fetch-depth: 0
          ref: ${{ github.event.inputs.baseBranch }}

      - name: Install prerequisites
        run: |
          python scripts/gha/install_prereqs_desktop.py
          python -m pip install requests

      - name: Name new branch
        run: |
          date_str=$(date "+%Y%m%d-%H%M%S")
          echo "NEW_BRANCH=${{env.branchPrefix}}${{github.run_number}}-${date_str}" >> $GITHUB_ENV

      - name: Create new branch
        run: |
          git remote update
          git checkout -b "${NEW_BRANCH}"
          echo "UPDATE_LOGFILE=update_log.txt" >> $GITHUB_ENV

      - name: Run update script
        run: |
          if [[ ${GITHUB_EVENT_INPUTS_UPDATEIOS} -eq 1 ]]; then
            if [[ ${GITHUB_EVENT_INPUTS_UPDATEANDROID} -eq 1 ]]; then
              # Update both
              echo "Updating all dependencies"
              python scripts/update_android_ios_dependencies.py --logfile=${UPDATE_LOGFILE}
              echo "CHOSEN_DEPS=mobile" >> $GITHUB_ENV
            else
              # Update iOS only
              echo "Updating iOS dependencies only"
              python scripts/update_android_ios_dependencies.py --skip_android --logfile=${UPDATE_LOGFILE}
              echo "CHOSEN_DEPS=iOS" >> $GITHUB_ENV
            fi
            # iOS: Update Firestore external version to match Firebase iOS SDK version.
            firebase_ios_version=$(grep "firebase-ios-sdk.git" ios_spm/Package.swift | sed 's/.*exact: "\([^"]*\)".*/\1/')
            echo "Setting Firestore external version to ${firebase_ios_version}"
            sed -i~ "s/^set(version [^)]*)/set(version CocoaPods-${firebase_ios_version})/i" cmake/external/firestore.cmake

            # Download the Firebase iOS prebuilt zip distribution for Analytics and Swift headers.
            echo "Downloading Firebase iOS SDK ${firebase_ios_version} prebuilt zip distribution"
            ziptmp="$(mktemp -d)"
            declare -a zip_urls
            zip_urls=("https://github.com/firebase/firebase-ios-sdk/releases/download/v${firebase_ios_version}/Firebase.zip" "https://github.com/firebase/firebase-ios-sdk/releases/download/${firebase_ios_version}/Firebase.zip")
            for try_url in ${zip_urls[@]} error; do
              curl -H 'Authorization: token ${{ github.token }}' -L -f "${try_url}" -o "${ziptmp}/Firebase.zip" 2> /dev/null && break
            done
            if [[ "${try_url}" == "error" ]]; then
              echo "::error ::Could not download Firebase iOS prebuilt zip file, skipping iOS headers update."
            else
              cd "${ziptmp}"
              echo "Unzipping..."
              unzip -q Firebase.zip
              cd -

              # iOS: Update Analytics header files, used for generating constants.
              echo "Updating Analytics iOS headers from version ${firebase_ios_version}"
              declare -a header_dirs
              header_dirs=("${ziptmp}"/FirebaseAnalytics/FirebaseAnalytics.xcframework/*/FirebaseAnalytics.framework/Headers)
              if [[ -d "${header_dirs[0]}" ]]; then
                header_dir="${header_dirs[0]}"
                cd analytics/ios_headers
                for ios_header in *.h; do
                  if [[ -f "${header_dir}/${ios_header}" ]]; then
                    cp -vf "${header_dir}/${ios_header}" .
                    if ! grep -q "^// Copyright [0-9]* Google LLC" "${ios_header}"; then
                      copyright_line="// Copyright $(date +%Y) Google LLC\n"
                    else
                      copyright_line=
                    fi
                    sed -i~ "s|^/// @file|${copyright_line}\n// Copied from Firebase Analytics iOS SDK ${firebase_ios_version}.\n\n/// @file|" "${ios_header}"
                    rm -f "${ios_header}~"
                    python ../../scripts/format_code.py --f "${ios_header}"
                  fi
                done
                cd -
              fi

              # Copy all *-Swift.h header files into ios_spm/swift_headers/
              echo "Copying Swift bridging headers..."
              mkdir -p ios_spm/swift_headers
              find "${ziptmp}" -name '*-Swift.h' -path '*ios*arm64*x86_64*simulator*' -print0 | xargs -0 -n 1 -J REPLACETEXT cp -f REPLACETEXT ios_spm/swift_headers/
              copyright_line="// Copyright $(date +%Y) Google LLC"
              # Add a note to each file about its source.
              for ios_header in ios_spm/swift_headers/*.h; do
                if ! grep -q "^// Copied from Firebase iOS SDK" "${ios_header}"; then
                  sed -i~ "s|^// Generated by Apple Swift|${copyright_line}\n// Copied from Firebase iOS SDK ${firebase_ios_version}.\n\n// Generated by Apple Swift|" "${ios_header}"
                fi
                python3 scripts/format_code.py --f "${ios_header}"
              done
            fi
            rm -rf "${ziptmp}"
          elif [[ ${GITHUB_EVENT_INPUTS_UPDATEANDROID} -eq 1 ]]; then
            # Update Android only
            echo "Updating Android dependencies only"
            python scripts/update_android_ios_dependencies.py --skip_ios --logfile=${UPDATE_LOGFILE}
            echo "CHOSEN_DEPS=Android" >> $GITHUB_ENV
          else
            echo "::error ::Neither Android nor iOS selected. Exiting."
            exit 1
          fi
          touch ${UPDATE_LOGFILE}  # In case it wasn't generated before
          cat ${UPDATE_LOGFILE}
        env:
          GITHUB_EVENT_INPUTS_UPDATEIOS: ${{ github.event.inputs.updateiOS }}
          GITHUB_EVENT_INPUTS_UPDATEANDROID: ${{ github.event.inputs.updateAndroid }}

      - name: Push branch if there are changes
        id: push-branch
        run: |
          if ! git update-index --refresh; then
            # Do a bit of post-processing on the update log to split it by platform.
            UPDATE_LOGFILE_PROCESSED=update_log_processed.txt
            touch "${UPDATE_LOGFILE_PROCESSED}"
            if grep -q ^Android: "${UPDATE_LOGFILE}"; then
              echo "### Android" >> "${UPDATE_LOGFILE_PROCESSED}"
              echo "" >> "${UPDATE_LOGFILE_PROCESSED}"
              grep ^Android: "${UPDATE_LOGFILE}" | sed 's/^Android: /- /' >> ${UPDATE_LOGFILE_PROCESSED}
              echo "" >> "${UPDATE_LOGFILE_PROCESSED}"
            fi
            if grep -q ^iOS: "${UPDATE_LOGFILE}"; then
              echo "### iOS" >> "${UPDATE_LOGFILE_PROCESSED}"
              echo "" >> "${UPDATE_LOGFILE_PROCESSED}"
              grep ^iOS: "${UPDATE_LOGFILE}" | sed 's/^iOS: /- /' >> ${UPDATE_LOGFILE_PROCESSED}
              echo "" >> "${UPDATE_LOGFILE_PROCESSED}"
            fi

            date_str=$(date "+%a %b %d %Y")
            commit_title="Update ${CHOSEN_DEPS} dependencies - ${date_str}"
            commit_body=
            if [[ -n "${GITHUB_EVENT_INPUTS_COMMENT}" ]]; then
              # If a comment was provided, start with that instead of blank.
              commit_body="${GITHUB_EVENT_INPUTS_COMMENT}

            "
            fi
            commit_body="${commit_body}$(cat ${UPDATE_LOGFILE_PROCESSED})

          > Created by [${GITHUB_WORKFLOW} workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            git config user.email "firebase-workflow-trigger-bot@google.com"
            git config user.name "firebase-workflow-trigger-bot"
            git config core.commentChar "%"  # so we can use # in git commit messages
            git commit -a -m "${commit_title}

          ${commit_body}"
            echo "branch_pushed=1" >> $GITHUB_OUTPUT
            # Show changes in git log
            git diff
            # Push branch
            git push --set-upstream origin "${NEW_BRANCH}"
            # Create pull request
            pr_number=$(python scripts/gha/create_pull_request.py --token ${STEPS_GENERATE_TOKEN_OUTPUTS_TOKEN} --head "${NEW_BRANCH}" --base "${GITHUB_EVENT_INPUTS_BASEBRANCH}" --title "${commit_title}" --body "${commit_body}")
            echo "created_pr_number=${pr_number}" >> $GITHUB_OUTPUT
          else
            echo "::warning ::No changes detected, won't create pull request."
            echo "branch_pushed=0" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_EVENT_INPUTS_COMMENT: ${{ github.event.inputs.comment }}
          STEPS_GENERATE_TOKEN_OUTPUTS_TOKEN: ${{ steps.generate-token.outputs.token }}
          GITHUB_EVENT_INPUTS_BASEBRANCH: ${{ github.event.inputs.baseBranch }}

      - name: Set test trigger label.
        uses: actions-ecosystem/action-add-labels@18f1af5e3544586314bbe15c0273249c770b2daf # ratchet:actions-ecosystem/action-add-labels@v1
        if: ${{ github.event.inputs.triggerTests == 1 && steps.push-branch.outputs.branch_pushed == 1 }}
        with:
          github_token: ${{ steps.generate-token.outputs.token }}
          number: ${{ steps.push-branch.outputs.created_pr_number }}
          labels: "${{ env.triggerTestsLabel }}"
